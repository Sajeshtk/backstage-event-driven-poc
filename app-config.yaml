app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

  packages: all

  extensions:
    - nav-item:search: false
    - nav-item:user-settings: false
    - nav-item:catalog: false
    - nav-item:scaffolder: false

    - page:catalog:
        config:
          path: /

organization:
  name: My Company
  # ===== ADD THIS SECTION =====
azureApim:
  subscriptionId: ${AZURE_SUBSCRIPTION_ID}
  resourceGroup: POCAPIM
  serviceName: APIMPOC23
  serviceUrl: https://apimpoc23.azure-api.net
  clientId: ${AZURE_CLIENT_ID}
  clientSecret: ${AZURE_CLIENT_SECRET}
  tenantId: ${AZURE_TENANT_ID}
# ===== END ADD =====

backend:
  auth:
    dangerouslyDisableDefaultAuthPolicy: true

  baseUrl: http://localhost:7007

  listen:
    port: 7007

  reading:
    allow:
      - host: localhost
      - host: 127.0.0.1
      - host: localhost:7007
      - host: 127.0.0.1:7007

  csp:
    connect-src: ["'self'", 'http:', 'https:']

  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  database:
    client: better-sqlite3
    connection: ':memory:'

  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

proxy:
  '/event-plugin':
    target: 'http://localhost:7007/api/event-plugin'
    changeOrigin: true

techdocs:
  builder: local

  generator:
    runIn: docker

  publisher:
    type: local

auth:
  providers:
    guest: {}

  experimentalClientIdMetadataDocuments:
    enabled: false

scaffolder:

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration

  rules:
    - allow:
        - Component
        - System
        - API
        - Resource
        - Location
        - User
        - Group

  locations:

     # ===== ADD THIS LOCATION =====
    # Azure APIM APIs
    - type: file
      target: ../../examples/apim-apis/*.yaml
      rules:
        - allow:
            - API
    # ===== END ADD =====

    # Dynamic RabbitMQ topics
    - type: url
      target: http://127.0.0.1:7007/api/event-plugin/catalog-info.yaml

      rules:
        - allow:
            - Resource

    # Default example entities
    - type: file
      target: ../../examples/entities.yaml

    # Templates
    - type: file
      target: ../../examples/template/template.yaml

      rules:
        - allow:
            - Template

    # Users and groups
    - type: file
      target: ../../examples/org.yaml

      rules:
        - allow:
            - User
            - Group

kubernetes:

permission:
  enabled: false

mcpActions:
  name: My Company Backstage

  description: >
    Tools for managing your software catalog,
    creating new services from templates,
    and exploring your developer portal
